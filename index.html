<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05030c">
<title>For Knu ✦</title>
<!-- All paths are RELATIVE, so this works at https://username.github.io/repo-name/ -->
<link rel="stylesheet" href="style.css">
</head>
<body class="intro">

<div id="bg" aria-hidden="true">
  <i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i>
  <i class="orb o4"></i><i class="orb o5"></i><i class="orb o6"></i>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="halo" aria-hidden="true"></div>
<canvas id="mosaic" role="img"
  aria-label="The letters K, N and U, each built from hundreds of tiny ways to say I love you in many languages"></canvas>

<h1 id="title">Wishing a very happy birthday to my sweet birthday gurlll ♥️❣️</h1>

<main id="opening">
  <button id="openBtn" type="button">OPEN YOUR LITTLE UNIVERSE ✦</button>
  <p>Put on your headphones.</p>
</main>

<div id="captions">
  <p class="msg1">Different languages, countless ways to say it.<br>But every single one means the same thing to me.</p>
  <p class="msg2">For you, Knu. Always. 💜</p>
</div>

<div id="controls">
  <button id="playBtn" type="button" aria-label="Play or pause music">Play</button>
  <button id="muteBtn" type="button" aria-label="Mute or unmute music">Mute</button>
  <button id="replayBtn" type="button">Replay the magic</button>
  <span id="audioNote" role="status"></span>
</div>

<!-- src is set from AUDIO_SRC in script.js -->
<audio id="song" preload="auto" playsinline></audio>

<script src="script.js"></script>
</body>
</html>
